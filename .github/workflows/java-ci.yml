name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile the application
        run: javac Bed.java Patient.java PatientCategory.java Inpatient.java HospitalSystem.java

      - name: Download JUnit
        run: curl -sL -o junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compile the tests
        run: javac -cp .:junit.jar HospitalSystemTest.java

      - name: Run the tests
        run: java -jar junit.jar execute --class-path . --scan-classpath --details=tree --fail-if-no-tests